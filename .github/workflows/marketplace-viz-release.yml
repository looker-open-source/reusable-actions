name: viz-release
on:
  workflow_call:
    secrets:
      LOS_AUTO_BOT_RP_TOKEN:
        required: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: google-github-actions/release-please-action@e4dc86ba9405554aeba3c6bb2d169500e7d3b4ee # v4
        id: release
        with:
          token: ${{ secrets.LOS_AUTO_BOT_RP_TOKEN }}
          release-type: node

  bundle-upload:
    needs: release-please
    runs-on: ubuntu-latest

    if: ${{ needs.release-please.outputs.release_created }}
    steps:
      - name: Repo checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Visualizations are modernized to use Webpack 5 and compile natively on Node 20
          node-version: '20'

      - name: Install dependencies and build/bundle
        run: |
          yarn install --immutable --immutable-cache --check-cache
          yarn build

      - name: Upload/attach production dist to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_RELEASE_PLEASE_OUTPUTS_TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload ${NEEDS_RELEASE_PLEASE_OUTPUTS_TAG_NAME} dist/bundle.js
